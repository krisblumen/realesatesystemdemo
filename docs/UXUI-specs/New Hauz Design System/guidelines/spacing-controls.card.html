<!-- @dsCard group="Spacing" viewport="700x170" name="Control Sizes" subtitle="Button 52px · Input 56px · radius 12px" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px 28px; background: var(--surface-card); font-family: var(--font-body); }
  .stack { display: flex; flex-direction: column; gap: 16px; max-width: 360px; }
  .btn { height: 52px; border-radius: 12px; border: none; background: var(--cta-bg); color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .03em; }
  .input { height: 56px; border-radius: 12px; border: 1.5px solid var(--border-strong); padding: 0 18px; font-size: 15px; color: var(--text-body); background: #fff; }
  .input::placeholder { color: var(--text-muted); }
  .lab { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="stack">
    <div><div class="lab">Botón · 52px</div></div>
    <button class="btn">Agendar Asesoría</button>
    <div class="lab">Input · 56px</div>
    <input class="input" placeholder="Buscar por zona — Juriquilla, Zibatá…">
  </div>
</body>
</html>
