<!-- @dsCard group="Colors" viewport="700x180" name="Brand Primaries" subtitle="Azul Corporativo, Naranja, Negro Premium, Blanco" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 78px; }
  .meta { padding: 10px 12px; font-family: var(--font-body); }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--text-strong); }
  .hex { font-size: 12px; color: var(--text-muted); letter-spacing: 0.02em; margin-top: 2px; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#091A5B"></div><div class="meta"><div class="name">Azul Corporativo</div><div class="hex">#091A5B</div></div></div>
    <div class="sw"><div class="chip" style="background:#F6A300"></div><div class="meta"><div class="name">Naranja Corporativo</div><div class="hex">#F6A300</div></div></div>
    <div class="sw"><div class="chip" style="background:#111111"></div><div class="meta"><div class="name">Negro Premium</div><div class="hex">#111111</div></div></div>
    <div class="sw"><div class="chip" style="background:#FFFFFF;border-bottom:1px solid var(--border-subtle)"></div><div class="meta"><div class="name">Blanco</div><div class="hex">#FFFFFF</div></div></div>
  </div>
</body>
</html>
