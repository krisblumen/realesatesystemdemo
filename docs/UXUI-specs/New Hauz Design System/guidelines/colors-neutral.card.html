<!-- @dsCard group="Colors" viewport="700x130" name="Neutrals" subtitle="Gris Oscuro → Fondo Claro, plus text/border roles" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); font-family: var(--font-body); }
  .row { display: flex; gap: 6px; }
  .sw { flex: 1; }
  .chip { height: 58px; border-radius: 8px; border: 1px solid rgba(0,0,0,.06); }
  .t { font-size: 11px; color: var(--text-muted); margin-top: 6px; text-align: center; letter-spacing: .01em; }
  .h { font-size: 10px; color: var(--text-muted); text-align: center; opacity:.7; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#2D2D2D"></div><div class="t">Gris Oscuro</div><div class="h">#2D2D2D</div></div>
    <div class="sw"><div class="chip" style="background:#5B5B5B"></div><div class="t">Gris Medio</div><div class="h">#5B5B5B</div></div>
    <div class="sw"><div class="chip" style="background:#C9C9C9"></div><div class="t">Gris 300</div><div class="h">#C9C9C9</div></div>
    <div class="sw"><div class="chip" style="background:#EAEAEA"></div><div class="t">Gris Claro</div><div class="h">#EAEAEA</div></div>
    <div class="sw"><div class="chip" style="background:#F2F2F2"></div><div class="t">Gris 100</div><div class="h">#F2F2F2</div></div>
    <div class="sw"><div class="chip" style="background:#F7F7F7"></div><div class="t">Fondo Claro</div><div class="h">#F7F7F7</div></div>
  </div>
</body>
</html>
