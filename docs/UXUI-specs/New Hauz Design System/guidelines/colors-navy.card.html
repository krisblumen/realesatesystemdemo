<!-- @dsCard group="Colors" viewport="700x130" name="Navy Scale" subtitle="Derived navy ramp for surfaces, states & dark sections" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); font-family: var(--font-body); }
  .row { display: flex; gap: 6px; }
  .sw { flex: 1; }
  .chip { height: 58px; border-radius: 8px; border: 1px solid rgba(0,0,0,.05); }
  .t { font-size: 11px; color: var(--text-muted); margin-top: 6px; text-align: center; letter-spacing: .02em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#050F38"></div><div class="t">900</div></div>
    <div class="sw"><div class="chip" style="background:#091A5B"></div><div class="t">800</div></div>
    <div class="sw"><div class="chip" style="background:#14246E"></div><div class="t">700</div></div>
    <div class="sw"><div class="chip" style="background:#233488"></div><div class="t">600</div></div>
    <div class="sw"><div class="chip" style="background:#3B4DA6"></div><div class="t">500</div></div>
    <div class="sw"><div class="chip" style="background:#DEE2F0"></div><div class="t">100</div></div>
    <div class="sw"><div class="chip" style="background:#EEF1F8"></div><div class="t">50</div></div>
  </div>
</body>
</html>
