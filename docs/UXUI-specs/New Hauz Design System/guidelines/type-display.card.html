<!-- @dsCard group="Type" viewport="700x230" name="Display — Montserrat" subtitle="Hero & section headlines, 800/700, tight tracking" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--surface-card); }
  .eyebrow { font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--nh-orange); }
  .d1 { font-family: var(--font-display); font-weight: 800; font-size: 52px; line-height: 1.04; letter-spacing: -.02em; color: var(--nh-navy); margin: 12px 0 0; }
  .d1 em { font-style: normal; color: var(--nh-orange); }
  .meta { font-family: var(--font-body); font-size: 12px; color: var(--text-muted); margin-top: 14px; }
</style>
</head>
<body>
  <div class="eyebrow">Firma Inmobiliaria Integral</div>
  <h1 class="d1">Construimos Patrimonio,<br>Diseñamos <em>Espacios</em></h1>
  <div class="meta">Montserrat ExtraBold 800 · 52px / 1.04 · tracking −0.02em</div>
</body>
</html>
