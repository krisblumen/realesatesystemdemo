<!-- @dsCard group="Brand" viewport="700x300" name="Hero Lockup" subtitle="Cinematic dark hero with overlay & dual CTA" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .hero { position: relative; height: 300px; background:
      linear-gradient(180deg, rgba(5,15,56,.35), rgba(5,15,56,.85)),
      linear-gradient(120deg, #14246E 0%, #050F38 70%);
    display: flex; flex-direction: column; justify-content: center; padding: 0 48px; overflow: hidden; }
  .eb { font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--nh-orange); }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1.05; letter-spacing: -.02em; color: #fff; margin: 14px 0 0; }
  h1 span { color: var(--nh-orange); }
  .ctas { display: flex; gap: 14px; margin-top: 26px; }
  .btn { height: 48px; padding: 0 26px; border-radius: 12px; font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .03em; display: inline-flex; align-items: center; border: none; }
  .primary { background: var(--nh-orange); color: #fff; box-shadow: var(--shadow-cta); }
  .ghost { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.55); }
</style>
</head>
<body>
  <div class="hero">
    <div class="eb">Querétaro · Inmobiliaria Integral</div>
    <h1>Construimos Patrimonio,<br>Diseñamos Espacios,<br><span>Comercializamos Oportunidades</span></h1>
    <div class="ctas">
      <button class="btn primary">Ver Propiedades</button>
      <button class="btn ghost">Agenda una Asesoría</button>
    </div>
  </div>
</body>
</html>
