<!-- @dsCard group="Type" viewport="700x150" name="Eyebrow & UI Labels" subtitle="Tracked uppercase Montserrat over imagery & sections" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 0; }
  .wrap { display: flex; height: 110px; }
  .light { flex: 1; background: var(--surface-card); padding: 22px 24px; }
  .dark { flex: 1; background: var(--nh-navy-900); padding: 22px 24px; }
  .eb { font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
  .eb.o { color: var(--nh-orange); }
  .eb.w { color: #fff; opacity: .9; }
  .sub { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.01em; margin-top: 8px; }
  .sub.n { color: var(--nh-navy); }
  .sub.l { color: #fff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="light"><div class="eb o">Inmobiliaria</div><div class="sub n">Comprar &amp; Rentar</div></div>
    <div class="dark"><div class="eb w">Inversionistas</div><div class="sub l">Modelo de Inversión</div></div>
  </div>
</body>
</html>
