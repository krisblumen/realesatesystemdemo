<!-- @dsCard group="Type" viewport="700x260" name="Heading Scale" subtitle="H1–H4 Montserrat 700/600" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 28px; background: var(--surface-card); }
  .line { display: flex; align-items: baseline; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--border-subtle); }
  .line:last-child { border-bottom: none; }
  .t { font-family: var(--font-display); color: var(--nh-navy); letter-spacing: -.02em; }
  .tag { font-family: var(--font-body); font-size: 11px; color: var(--text-muted); margin-left: auto; white-space: nowrap; }
  .h1 { font-weight: 700; font-size: 40px; }
  .h2 { font-weight: 700; font-size: 32px; }
  .h3 { font-weight: 600; font-size: 24px; }
  .h4 { font-weight: 600; font-size: 20px; }
</style>
</head>
<body>
  <div class="line"><span class="t h1">Proyectos Destacados</span><span class="tag">H1 · 700 · 40px</span></div>
  <div class="line"><span class="t h2">Servicios Integrales</span><span class="tag">H2 · 700 · 32px</span></div>
  <div class="line"><span class="t h3">Casa en Juriquilla</span><span class="tag">H3 · 600 · 24px</span></div>
  <div class="line"><span class="t h4">Ficha Técnica</span><span class="tag">H4 · 600 · 20px</span></div>
</body>
</html>
