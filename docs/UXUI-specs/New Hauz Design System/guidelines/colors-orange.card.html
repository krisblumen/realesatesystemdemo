<!-- @dsCard group="Colors" viewport="700x130" name="Orange Scale" subtitle="Conversion accent ramp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); font-family: var(--font-body); }
  .row { display: flex; gap: 6px; }
  .sw { flex: 1; }
  .chip { height: 58px; border-radius: 8px; border: 1px solid rgba(0,0,0,.05); }
  .t { font-size: 11px; color: var(--text-muted); margin-top: 6px; text-align: center; letter-spacing: .02em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#C77E00"></div><div class="t">600</div></div>
    <div class="sw"><div class="chip" style="background:#D98C00"></div><div class="t">hover</div></div>
    <div class="sw"><div class="chip" style="background:#F6A300"></div><div class="t">500</div></div>
    <div class="sw"><div class="chip" style="background:#FFB829"></div><div class="t">400</div></div>
    <div class="sw"><div class="chip" style="background:#FDE9C9"></div><div class="t">100</div></div>
    <div class="sw"><div class="chip" style="background:#FFF7E8"></div><div class="t">50</div></div>
  </div>
</body>
</html>
