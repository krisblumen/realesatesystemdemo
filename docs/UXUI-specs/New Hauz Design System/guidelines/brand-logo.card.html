<!-- @dsCard group="Brand" viewport="700x220" name="Logo — Color & Mono" subtitle="Versión principal on light & dark; monogram" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); }
  .wrap { display: flex; height: 220px; }
  .cell { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .light { background: var(--surface-card); }
  .dark { background: var(--nh-navy-900); }
  .mono { background: var(--surface-muted); }
  .cell img { max-width: 70%; max-height: 110px; object-fit: contain; }
  .mono img { max-height: 96px; }
  .cap { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
  .cap.d { color: rgba(255,255,255,.65); }
  .cap.l { color: var(--text-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="cell light"><img src="../assets/logos/newhauz-logo-color.png" alt="New Hauz logo"><div class="cap l">Principal · sobre claro</div></div>
    <div class="cell dark"><img src="../assets/logos/newhauz-logo-on-dark.png" alt="New Hauz logo white"><div class="cap d">Sobre oscuro</div></div>
    <div class="cell mono"><img src="../assets/logos/newhauz-monogram.png" alt="New Hauz monogram"><div class="cap l">Monograma NH</div></div>
  </div>
</body>
</html>
