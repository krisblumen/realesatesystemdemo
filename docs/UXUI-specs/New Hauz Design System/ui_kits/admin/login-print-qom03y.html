<!DOCTYPE html>
<html lang="es">
<head>
<style data-omelette-print-defaults>
@media print {
  @page { margin: 0; }
  body { padding: 0.5in; box-sizing: border-box; }
  h1, h2, h3, h4, h5, h6 { break-after: avoid; }
  figure, table, pre, blockquote, img, svg, tr, [class~="card" i] { break-inside: avoid; }
  img, svg { max-width: 100%; }
  p { orphans: 3; widows: 3; }
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NewHauz Admin — Login</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  :root{
    --slate:#1E293B;
    --slate-hover:#0F172A;
    --brand-navy:#091A5B;
    --brand-orange:#F6A300;
    --rad-card:16px;
    --rad-ctrl:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:#e9e9ec;}

  /* ---- canvas shell (scrolls; never center an overflowing row) ---- */
  .canvas{
    width:max-content;min-width:100%;min-height:100vh;
    padding:48px;box-sizing:border-box;
    background:#e9e9ec;
  }
  .canvas-head{margin:0 4px 28px;}
  .canvas-head h1{font-family:var(--font-display);font-weight:700;font-size:24px;color:#111;margin:0;letter-spacing:-.01em;}
  .canvas-head p{font-family:var(--font-body);font-size:14px;color:#5B5B5B;margin:6px 0 0;}

  .group-label{font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5B5B5B;margin:34px 4px 16px;}
  .row{display:flex;gap:28px;align-items:flex-start;}

  .frame{flex:none;}
  .frame-cap{font-family:var(--font-display);font-weight:600;font-size:12.5px;color:#475569;margin:0 0 10px 2px;display:flex;align-items:center;gap:8px;}
  .frame-cap .num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:var(--slate);color:#fff;font-size:11px;font-weight:700;}
  .frame-card{width:440px;height:600px;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(15,23,42,.14);border:1px solid rgba(0,0,0,.05);}

  /* ---- login screen (the actual mockup) ---- */
  .screen{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px;}
  .screen.light{background:radial-gradient(circle at 50% 28%, rgba(9,26,91,.09), transparent 58%), linear-gradient(160deg,#F7F7F7 0%,#EAEAEA 100%);}
  .screen.dark{background:radial-gradient(circle at 50% 28%, rgba(246,163,0,.12), transparent 56%), linear-gradient(160deg,#111111 0%,#2D2D2D 100%);}

  .logo{height:40px;margin-bottom:-20px;position:relative;z-index:2;filter:drop-shadow(0 6px 14px rgba(0,0,0,.12));}

  .card{
    position:relative;width:360px;padding:38px 34px 32px;border-radius:var(--rad-card);
    backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  }
  .light .card{background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.75);box-shadow:0 18px 50px rgba(15,23,42,.16), inset 0 1px 0 rgba(255,255,255,.7);}
  .dark .card{background:rgba(28,30,36,.55);border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);}

  .card h2{font-family:var(--font-display);font-weight:600;font-size:21px;margin:14px 0 4px;letter-spacing:-.01em;}
  .light .card h2{color:#1E293B;}
  .dark .card h2{color:#F8FAFC;}
  .card .sub{font-family:var(--font-body);font-size:13.5px;margin:0 0 24px;}
  .light .card .sub{color:#64748B;}
  .dark .card .sub{color:#94A3B8;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-family:var(--font-body);font-weight:500;font-size:12.5px;margin-bottom:7px;}
  .light .field label{color:#475569;}
  .dark .field label{color:#CBD5E1;}

  .control{position:relative;}
  .control input{
    width:100%;height:52px;border-radius:var(--rad-ctrl);padding:0 16px;font-family:var(--font-body);font-size:14.5px;
    outline:none;transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .control input::placeholder{color:#94A3B8;}
  .light .control input{background:#fff;border:1.5px solid #E2E8F0;color:#1E293B;}
  .dark .control input{background:rgba(17,17,20,.5);border:1.5px solid rgba(255,255,255,.14);color:#F1F5F9;}
  .control.has-eye input{padding-right:46px;}

  .eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:6px;display:flex;color:#94A3B8;}
  .eye:hover{color:#64748B;}

  /* focus state */
  .control input:focus,
  .control.focus input{border-color:var(--brand-orange);box-shadow:0 0 0 3px rgba(246,163,0,.22);}

  /* error state */
  .field.error input{border-color:#DC2626;background:rgba(220,38,38,.04);}
  .field.error input:focus{box-shadow:0 0 0 3px rgba(220,38,38,.18);}

  .meta{display:flex;align-items:center;justify-content:space-between;margin:4px 0 22px;}
  .remember{display:flex;align-items:center;gap:8px;font-family:var(--font-body);font-size:13px;cursor:pointer;}
  .light .remember{color:#475569;}
  .dark .remember{color:#CBD5E1;}
  .remember input{width:16px;height:16px;accent-color:var(--slate);}
  .dark .remember input{accent-color:var(--brand-orange);}
  .forgot{font-family:var(--font-body);font-size:13px;text-decoration:none;transition:color .2s ease;}
  .light .forgot{color:#64748B;}
  .dark .forgot{color:#94A3B8;}
  .forgot:hover{color:var(--brand-navy);}
  .dark .forgot:hover{color:var(--brand-orange);}

  .btn{
    width:100%;height:52px;border:none;border-radius:var(--rad-ctrl);background:var(--slate);color:#fff;
    font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.01em;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:10px;
    transition:background .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .btn:hover{background:var(--slate-hover);transform:translateY(-1px);box-shadow:0 10px 22px rgba(15,23,42,.22);}
  .dark .btn{background:#334155;}
  .dark .btn:hover{background:#1E293B;}
  .btn[disabled]{cursor:default;opacity:.92;transform:none;box-shadow:none;}

  .spinner{width:17px;height:17px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* alert banners */
  .alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;margin-bottom:20px;font-family:var(--font-body);font-size:13px;line-height:1.45;}
  .alert svg{flex-shrink:0;margin-top:1px;}
  .alert-error{background:rgba(220,38,38,.09);border:1px solid rgba(220,38,38,.28);color:#B91C1C;}
  .alert-suspend{background:rgba(246,163,0,.12);border:1px solid rgba(246,163,0,.42);color:#92400E;}
  .dark .alert-error{background:rgba(220,38,38,.16);border-color:rgba(220,38,38,.4);color:#FCA5A5;}
  .dark .alert-suspend{background:rgba(246,163,0,.16);border-color:rgba(246,163,0,.5);color:#FCD34D;}

  .foot{margin-top:22px;font-family:var(--font-body);font-size:12px;text-align:center;position:relative;z-index:2;}
  .light .foot{color:#94A3B8;}
  .dark .foot{color:#64748B;}
  .foot b{font-weight:600;color:var(--brand-navy);}
  .dark .foot b{color:#7C9BE8;}
</style>
</head>
<body>
<div class="canvas">
  <div class="canvas-head">
    <h1>NewHauz Admin System — Iniciar Sesión</h1>
    <p>Panel interno · Laravel 13 + Filament v3 · glass minimal, slate sobrio, naranja sólo en foco. Logo flota sobre la tarjeta glass.</p>
  </div>

  <div class="group-label">Modo Claro</div>
  <div class="row" id="rowLight"></div>

  <div class="group-label">Modo Oscuro</div>
  <div class="row" id="rowDark"></div>
</div>

<script>
const EYE = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.2A9.5 9.5 0 0 1 12 4c6.5 0 10 7 10 7a13.2 13.2 0 0 1-2.2 3M6.6 6.6A13.3 13.3 0 0 0 2 11s3.5 7 10 7a9.3 9.3 0 0 0 4.6-1.1"/><path d="M14.1 14.1A3 3 0 0 1 9.9 9.9"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
const ALERT = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.3 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.3a2 2 0 0 0-3.4 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';

function screen(o){
  const dark = o.mode === 'dark';
  const logo = dark ? '../../assets/logos/newhauz-logo-on-dark.png' : '../../assets/logos/newhauz-logo-color.png';
  const emailErr = o.error ? ' error' : '';
  const passErr = o.error ? ' error' : '';
  const emailVal = (o.error||o.suspended||o.loading) ? 'admin@newhauz.mx' : '';
  const passDots = (o.error||o.loading) ? '••••••••' : '';

  let banner = '';
  if(o.error) banner = `<div class="alert alert-error">${ALERT}<span><b>Credenciales incorrectas.</b> Verifica tu correo y contraseña e inténtalo de nuevo.</span></div>`;
  if(o.suspended) banner = `<div class="alert alert-suspend">${ALERT}<span><b>Tu cuenta ha sido suspendida.</b> Contacta al administrador del sistema.</span></div>`;

  const btn = o.loading
    ? `<button class="btn" disabled><span class="spinner"></span>Entrando…</button>`
    : `<button class="btn">Entrar</button>`;

  return `
  <div class="screen ${dark?'dark':'light'}">
    <img class="logo" src="${logo}" alt="New Hauz">
    <div class="card">
      <h2>Iniciar sesión</h2>
      <p class="sub">Accede a tu panel de administración</p>
      ${banner}
      <div class="field${emailErr}">
        <label>Correo electrónico</label>
        <div class="control"><input type="email" value="${emailVal}" placeholder="nombre@newhauz.mx" ${o.suspended?'':''}></div>
      </div>
      <div class="field${passErr}">
        <label>Contraseña</label>
        <div class="control has-eye${o.focus?' focus':''}">
          <input type="password" value="${passDots}" placeholder="••••••••">
          <button class="eye" type="button">${EYE}</button>
        </div>
      </div>
      <div class="meta">
        <label class="remember"><input type="checkbox"> Recordarme</label>
        <a class="forgot" href="#">¿Olvidaste tu contraseña?</a>
      </div>
      ${btn}
    </div>
    <div class="foot">NewHauz Admin System © 2026 <b>By GESIF</b></div>
  </div>`;
}

function frame(num, cap, o){
  return `<div class="frame">
    <div class="frame-cap"><span class="num">${num}</span>${cap}</div>
    <div class="frame-card">${screen(o)}</div>
  </div>`;
}

document.getElementById('rowLight').innerHTML =
  frame(1,'Por defecto',{mode:'light'}) +
  frame(2,'Input con foco (anillo naranja)',{mode:'light',focus:true}) +
  frame(3,'Error de credenciales',{mode:'light',error:true}) +
  frame(4,'Cuenta suspendida',{mode:'light',suspended:true}) +
  frame(5,'Botón cargando',{mode:'light',loading:true});

document.getElementById('rowDark').innerHTML =
  frame(6,'Por defecto (oscuro)',{mode:'dark'}) +
  frame(7,'Foco + error (oscuro)',{mode:'dark',focus:true,error:true});

/* interactivity: password show/hide + real focus rings */
document.querySelectorAll('.eye').forEach(b=>{
  b.addEventListener('click',()=>{
    const inp=b.parentElement.querySelector('input');
    if(inp.type==='password'){inp.type='text';b.innerHTML=EYE_OFF;}
    else{inp.type='password';b.innerHTML=EYE;}
  });
});
</script>
<script>
(async () => {
  if (!document.title || !document.title.trim()) document.title = "login";
  // Prepend so page-supplied @page / break rules (deck-stage's margin:0,
  // author CSS) keep source-order precedence over the baseline.
  const baseCss = document.createElement('style');
  baseCss.textContent = "@media print {\n  @page { margin: 0.5cm; }\n  figure, table { break-inside: avoid; }\n  *, *::before, *::after {\n    print-color-adjust: exact; -webkit-print-color-adjust: exact;\n    backdrop-filter: none !important; -webkit-backdrop-filter: none !important;\n    animation-delay: -99s !important; animation-duration: .001s !important;\n    animation-iteration-count: 1 !important; animation-fill-mode: both !important;\n    animation-play-state: running !important; transition-duration: 0s !important;\n  }\n}";
  document.head.prepend(baseCss);
  if (document.readyState === 'loading') {
    await new Promise((r) => document.addEventListener('DOMContentLoaded', r, { once: true }));
  }
  let ds = document.querySelector('deck-stage');
  // whenDefined never resolves when nothing registers the element, so only
  // await it when a <deck-stage> tag exists (and race a timeout regardless).
  if (ds && !customElements.get('deck-stage')) {
    try {
      await Promise.race([
        customElements.whenDefined('deck-stage'),
        new Promise((r) => setTimeout(r, 3000)),
      ]);
    } catch (e) {}
    ds = document.querySelector('deck-stage');
  }
  // dc-runtime assigns window.DCLogic at init and mounts into #dc-root on
  // DOMContentLoaded; settle on that subtree so React has rendered before
  // print(). Non-DC pages fall through to weighing body.
  const isDc = !ds && 'DCLogic' in window;
  const settleRoot = ds || (isDc ? document.getElementById('dc-root') : null) || document.body;
  if (settleRoot) {
    // Weigh only content children — skip script/style/template so inline
    // Babel/CSS doesn't register as stable "content" before the framework
    // has mounted anything.
    const MEDIA = 'img,svg,canvas,video,picture,iframe,embed,object';
    const weigh = () => {
      let text = 0, media = 0;
      for (const c of settleRoot.children) {
        const t = c.tagName;
        if (t === 'SCRIPT' || t === 'STYLE' || t === 'TEMPLATE') continue;
        text += (c.textContent || '').trim().length;
        media += c.querySelectorAll(MEDIA).length + (c.matches(MEDIA) ? 1 : 0);
      }
      return text + media * 100;
    };
    // "Non-zero and stable" alone is not sufficient to mean rendered: generic
    // body can carry a static shell while async main content is pending, and
    // #dc-root can carry the root DC's static text while child refs are still
    // .sc-placeholder boxes. Gate generic on readyState 'complete', and never
    // accept stability while a dc-runtime placeholder is present.
    const isGeneric = settleRoot === document.body;
    const deadline = Date.now() + 15000;
    let last = -1, stable = 0;
    while (Date.now() < deadline) {
      const n = weigh();
      const ready =
        (!isGeneric || document.readyState === 'complete') &&
        !settleRoot.querySelector('.sc-placeholder');
      if (n > 0 && n === last && ready) { if (++stable >= 2) break; } else { stable = 0; }
      last = n;
      await new Promise((r) => setTimeout(r, 250));
    }
  }
  // Reveal content gated on scroll or visibility before printing. Lazy <img>,
  // IntersectionObserver fade-ins, and collapsed <details> don't render while
  // off-screen, so a long page would print with them blank or closed. Open
  // every <details>, force native-lazy images eager, and scroll the document
  // through its full height to trip lazy-load + IO; then wait (bounded) for the
  // newly-triggered images. Inert for deck-stage (slides aren't scroll-gated).
  try {
    for (const d of document.querySelectorAll('details')) d.open = true;
    for (const img of document.querySelectorAll('img[loading="lazy"]'))
      img.loading = 'eager';
    const scroller = document.scrollingElement || document.documentElement;
    const full = Math.max(scroller.scrollHeight, document.body.scrollHeight);
    const step = window.innerHeight || 800;
    for (let y = 0; y <= full; y += step) {
      window.scrollTo(0, y);
      await new Promise((r) => requestAnimationFrame(r));
    }
    window.scrollTo(0, 0);
    await Promise.race([
      Promise.all(
        [...document.images].map((img) =>
          img.complete
            ? null
            : new Promise((res) => {
                img.addEventListener('load', res, { once: true });
                img.addEventListener('error', res, { once: true });
              })
        )
      ),
      new Promise((r) => setTimeout(r, 4000)),
    ]);
  } catch (e) {}
  try { await document.fonts.ready; } catch (e) {}
  // Jump every animation to its end state so print() never captures a slide
  // mid-entrance. Ordering matters: the 0s-transition style must be live
  // BEFORE data-deck-active is set so attribute-keyed transitions don't
  // start a (now-0s) run from the pre-active base.
  const st = document.createElement('style');
  st.textContent = '*,*::before,*::after{animation-delay:-99s !important;animation-duration:.001s !important;animation-iteration-count:1 !important;animation-fill-mode:both !important;animation-play-state:running !important;transition-duration:0s !important}';
  document.head.appendChild(st);
  for (const d of document.querySelectorAll('deck-stage')) {
    for (const c of d.children) {
      const t = c.tagName;
      if (t === 'SCRIPT' || t === 'STYLE' || t === 'TEMPLATE') continue;
      c.setAttribute('data-deck-active', '');
    }
  }
  // Re-append deck-stage's @page last so no author @page can add a margin and
  // spill each full-bleed slide onto two sheets. Backstop for old copies.
  if (ds) {
    let pg = document.getElementById('deck-stage-print-page');
    if (!pg) {
      pg = document.createElement('style');
      pg.textContent = '@page{size:' + (+ds.getAttribute('width') || 1920) +
        'px ' + (+ds.getAttribute('height') || 1080) + 'px;margin:0}';
    }
    document.body.appendChild(pg);
  }
  try {
    const sweep = () => {
      for (const a of document.getAnimations()) {
        try { a.finish(); } catch (e) {
          try { a.currentTime = (a.effect && a.effect.getComputedTiming().duration) || 0; a.pause(); } catch (e2) {}
        }
      }
    };
    sweep();
    await new Promise((r) => requestAnimationFrame(r));
    sweep();
    await new Promise((r) => requestAnimationFrame(r));
  } catch (e) {}
  // Relax break-inside on oversized elements. An element taller than a
  // printable page can't honor break-inside: avoid — browsers either overflow
  // it or push it whole to the next page, leaving a blank gap, then break it
  // anyway at an arbitrary point. After the final layout (content revealed,
  // animations jumped), find elements taller than a page that still compute
  // break-inside: avoid and reset them to auto, so the browser breaks them at
  // their children's boundaries instead (children keep their own avoid). PAGE_PX
  // is a conservative portrait estimate at 96 CSS px/in — Letter/A4 usable
  // height minus our 0.5in margins — so only clearly-oversized elements are
  // touched and under-page elements still stay whole. Skipped for decks, whose
  // slides are sized to the page.
  try {
    if (!document.querySelector('deck-stage')) {
      const PAGE_PX = 1024;
      // Our print defaults add a body padding inset only when we also zero the
      // @page margin; computed style can't tell us (it reports screen media),
      // so read the injected rule directly.
      const defaults = document.querySelector('style[data-omelette-print-defaults]');
      const pageInset = /body\s*\{[^}]*padding/.test(defaults ? defaults.textContent || '' : '');
      const SEL = 'section,article,figure,table,pre,blockquote,[class~="card" i],[class~="page" i],[class~="sheet" i]';
      for (const el of document.body.querySelectorAll(SEL)) {
        if (el instanceof HTMLElement && el.offsetHeight > PAGE_PX) {
          el.setAttribute('data-om-oversized', '');
          // Fake-paged docs simulate sheets with over-tall break-after:page
          // boxes; honoring the break spills half-blank pages and ends a
          // colored box mid-sheet. Flow them, and (only when we own the page
          // inset) drop the redundant padding/background via the rule below.
          const cs = getComputedStyle(el);
          if (cs.breakAfter === 'page' || cs.pageBreakAfter === 'always') {
            el.setAttribute('data-om-fakepage', '');
          }
        }
      }
      const ost = document.createElement('style');
      ost.textContent = '@media print{' +
        '[data-om-oversized]{break-inside:auto !important;page-break-inside:auto !important}' +
        '[data-om-fakepage]{break-after:auto !important;page-break-after:auto !important}' +
        (pageInset ? '[data-om-fakepage]{padding:0 !important;background:none !important}' : '') +
        '}';
      document.head.appendChild(ost);
    }
  } catch (e) {}
  // macOS Preview renders Skia-PDF Luminosity soft-masks as opaque grey boxes;
  // swap the CSS that triggers them for Preview-safe forms.
  try {
    for (const el of document.body.querySelectorAll('*')) {
      const cs = getComputedStyle(el);

      if (cs.boxShadow !== 'none' && cs.filter === 'none') {
        const outs = [], kept = [];
        for (const s of cs.boxShadow.split(/,(?![^(]*[)])/)) {
          const t = s.trim();
          const m = t.match(/^(rgba?[(][^)]+[)]) (-?[0-9.]+px) (-?[0-9.]+px) ([0-9.]+px) -?[0-9.]+px$/);
          if (m && parseFloat(m[4]) > 0) outs.push('drop-shadow(' + m[2] + ' ' + m[3] + ' ' + m[4] + ' ' + m[1] + ')');
          else kept.push(t);
        }
        if (outs.length) {
          el.style.setProperty('filter', outs.join(' '), 'important');
          el.style.setProperty('box-shadow', kept.join(', ') || 'none', 'important');
        }
      }

      const mask = cs.maskImage && cs.maskImage !== 'none' ? cs.maskImage : cs.webkitMaskImage;
      if (mask && mask !== 'none' && cs.filter === 'none') el.style.setProperty('filter', 'opacity(1)', 'important');
    }
  } catch (e) {}
  setTimeout(() => { try { window.print(); } catch (e) {} }, 200);
})();
</script>
</body>
</html>
